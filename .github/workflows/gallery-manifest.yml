name: Generate Gallery Manifest

on:
  push:
    branches:
      - main
    paths:
      - "images/gallery/**"
      - ".github/workflows/gallery-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate gallery.json
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          root = Path("images/gallery")
          image_ext = {".webp", ".jpg", ".jpeg", ".png", ".gif", ".avif"}
          folders = []

          if root.exists():
              for folder in sorted(root.iterdir(), key=lambda p: p.name.lower()):
                  if not folder.is_dir():
                      continue
                  images = sorted(
                      [p.name for p in folder.iterdir()
                       if p.is_file() and p.suffix.lower() in image_ext],
                      key=str.lower
                  )
                  folders.append({
                      "name": folder.name,
                      "images": images
                  })

          Path("gallery.json").write_text(
              json.dumps(folders, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          if git diff --cached --quiet; then
            echo "gallery.json is already up to date"
          else
            git commit -m "Update gallery manifest"
            git push
          fi
