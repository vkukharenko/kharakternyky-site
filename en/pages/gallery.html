<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gallery — Kharakternyky</title><meta name="description" content="Visuals from the Kharakternyky literary universe."><link rel="stylesheet" href="../../style.css"></head><body><header class="inner-header"><nav class="nav"><a class="logo" href="../index.html">KHARAKTERNYKY</a><div class="nav-links"><a href="books.html">Books</a><a href="universe.html">Universe</a><a href="technology.html">Technology</a><a href="characters.html">Characters</a><a class="active" href="gallery.html">Gallery</a><a href="author.html">Author</a><a href="../../pages/gallery.html" lang="uk">UK</a></div></nav><div class="page-heading"><p class="eyebrow">THE VISUAL WORLD</p><h1>Gallery</h1></div></header><main><section class="section section-dark"><div id="gallery" class="gallery-folders"><div class="gallery-status">Loading gallery…</div></div></section></main><div id="lightbox" class="lightbox" aria-hidden="true"><button class="lightbox-close" aria-label="Close">×</button><button class="lightbox-prev" aria-label="Previous image">‹</button><img id="lightbox-image" src="" alt=""><button class="lightbox-next" aria-label="Next image">›</button></div><footer><p>© 2026 Volodymyr Kukharenko</p></footer><script>
const BASE="https://vkukharenko.github.io/kharakternyky-site/images/gallery/";const gallery=document.getElementById("gallery"),box=document.getElementById("lightbox"),big=document.getElementById("lightbox-image");let list=[],pos=0;function openBox(a,i){list=a;pos=i;big.src=list[pos];box.classList.add("open");box.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}function closeBox(){box.classList.remove("open");box.setAttribute("aria-hidden","true");big.src="";document.body.style.overflow=""}function move(n){if(list.length){pos=(n+list.length)%list.length;big.src=list[pos]}}document.querySelector(".lightbox-close").onclick=closeBox;document.querySelector(".lightbox-prev").onclick=()=>move(pos-1);document.querySelector(".lightbox-next").onclick=()=>move(pos+1);box.onclick=e=>{if(e.target===box)closeBox()};document.onkeydown=e=>{if(!box.classList.contains("open"))return;if(e.key==="Escape")closeBox();if(e.key==="ArrowLeft")move(pos-1);if(e.key==="ArrowRight")move(pos+1)};async function load(){try{const r=await fetch("../../gallery.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);const folders=await r.json();gallery.innerHTML="";if(!folders.length){gallery.innerHTML='<div class="gallery-status">No image folders yet.</div>';return}const selected=new URLSearchParams(location.search).get("folder");for(const folder of folders){let d=document.createElement("details");d.className="gallery-folder";d.open=selected===folder.name;let s=document.createElement("summary");s.textContent=folder.name;let c=document.createElement("div");c.className="folder-content";let g=document.createElement("div");g.className="photo-grid";let urls=folder.images.map(n=>BASE+encodeURIComponent(folder.name)+"/"+encodeURIComponent(n));folder.images.forEach((name,i)=>{let card=document.createElement("div"),im=document.createElement("img");card.className="photo-card";im.src=urls[i];im.alt="";im.loading="lazy";card.appendChild(im);card.onclick=()=>openBox(urls,i);g.appendChild(card)});if(folder.images.length)c.appendChild(g);else c.innerHTML='<div class="gallery-status">No images in this folder.</div>';d.append(s,c);gallery.appendChild(d)}}catch(e){gallery.innerHTML='<div class="gallery-error">Could not load the gallery. Please refresh the page.</div>';console.error(e)}}load();</script></body></html>
