<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея — Характерники</title>
<link rel="stylesheet" href="../style.css">
<style>
.gallery-folders{display:grid;gap:14px;max-width:1200px;margin:auto}.gallery-folder{border:1px solid rgba(255,255,255,.12);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.025)}
.gallery-folder summary{cursor:pointer;padding:18px 20px;font-size:1.05rem;font-weight:600;list-style:none}.gallery-folder summary::-webkit-details-marker{display:none}.gallery-folder summary:before{content:"▸";display:inline-block;margin-right:10px;transition:.2s}.gallery-folder[open] summary:before{transform:rotate(90deg)}
.folder-content{padding:0 20px 20px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.photo-card{aspect-ratio:1;overflow:hidden;border-radius:7px;cursor:pointer;background:#111}.photo-card img{width:100%;height:100%;object-fit:cover;display:block;transition:.2s}.photo-card:hover img{transform:scale(1.04)}
.gallery-status{text-align:center;padding:28px;opacity:.7}.gallery-error{padding:18px;border:1px solid rgba(255,100,100,.3);border-radius:8px}
.lightbox{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:30px;background:rgba(0,0,0,.9)}.lightbox.open{display:flex}.lightbox img{max-width:94vw;max-height:90vh;width:auto;height:auto;object-fit:contain}.lightbox-close{position:fixed;top:15px;right:22px;z-index:10000;border:0;background:none;color:#fff;font-size:40px;cursor:pointer}.lightbox-prev,.lightbox-next{position:fixed;top:50%;transform:translateY(-50%);z-index:10000;border:0;background:rgba(0,0,0,.35);color:#fff;width:46px;height:64px;font-size:32px;cursor:pointer}.lightbox-prev{left:18px}.lightbox-next{right:18px}
@media(max-width:700px){.photo-grid{grid-template-columns:repeat(2,1fr);gap:8px}.folder-content{padding:0 10px 10px}.lightbox{padding:10px}}
</style>
</head>
<body>
<header class="inner-header"><nav class="nav">
<a class="logo" href="../index.html">ХАРАКТЕРНИКИ</a><div class="nav-links">
<a href="books.html">Книги</a><a href="universe.html">Всесвіт</a><a href="technology.html">Технології</a><a href="characters.html">Персонажі</a><a class="active" href="gallery.html">Галерея</a><a href="author.html">Автор</a>
</div></nav><div class="page-heading"><p class="eyebrow">ВІЗУАЛЬНИЙ СВІТ</p><h1>Галерея</h1></div></header>
<main><section class="section section-dark"><div id="gallery" class="gallery-folders"><div class="gallery-status">Завантаження…</div></div></section></main>
<div id="lightbox" class="lightbox" aria-hidden="true"><button class="lightbox-close" aria-label="Закрити">×</button><button class="lightbox-prev" aria-label="Попередня">‹</button><img id="lightbox-image" src="" alt=""><button class="lightbox-next" aria-label="Наступна">›</button></div>
<footer><p>© 2026 Володимир Кухаренко</p></footer>
<script>
const BASE="https://vkukharenko.github.io/kharakternyky-site/images/gallery/";
const EXT=[".webp",".jpg",".jpeg",".png",".gif",".avif"];
const gallery=document.getElementById("gallery"),box=document.getElementById("lightbox"),big=document.getElementById("lightbox-image");let list=[],pos=0;
function openBox(a,i){list=a;pos=i;big.src=list[pos];box.classList.add("open");box.setAttribute("aria-hidden","false");document.body.style.overflow="hidden"}
function closeBox(){box.classList.remove("open");box.setAttribute("aria-hidden","true");big.src="";document.body.style.overflow=""}
function move(n){if(list.length){pos=(n+list.length)%list.length;big.src=list[pos]}}
document.querySelector(".lightbox-close").onclick=closeBox;document.querySelector(".lightbox-prev").onclick=()=>move(pos-1);document.querySelector(".lightbox-next").onclick=()=>move(pos+1);box.onclick=e=>{if(e.target===box)closeBox()};document.onkeydown=e=>{if(!box.classList.contains("open"))return;if(e.key==="Escape")closeBox();if(e.key==="ArrowLeft")move(pos-1);if(e.key==="ArrowRight")move(pos+1)};
async function load(){try{
const r=await fetch("../gallery.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);
const folders=await r.json();gallery.innerHTML="";
if(!folders.length){gallery.innerHTML='<div class="gallery-status">Папок зі світлинами поки немає.</div>';return}
const selected=new URLSearchParams(location.search).get("folder");
for(const folder of folders){let d=document.createElement("details");d.className="gallery-folder";d.open=selected===folder.name;let s=document.createElement("summary");s.textContent=folder.name;let c=document.createElement("div");c.className="folder-content";let g=document.createElement("div");g.className="photo-grid";let urls=folder.images.map(n=>BASE+encodeURIComponent(folder.name)+"/"+encodeURIComponent(n));
folder.images.forEach((name,i)=>{let card=document.createElement("div"),im=document.createElement("img");card.className="photo-card";im.src=urls[i];im.alt="";im.loading="lazy";card.appendChild(im);card.onclick=()=>openBox(urls,i);g.appendChild(card)});
if(folder.images.length)c.appendChild(g);else c.innerHTML='<div class="gallery-status">У цій папці немає світлин.</div>';d.append(s,c);gallery.appendChild(d)}
}catch(e){gallery.innerHTML='<div class="gallery-error">Не вдалося завантажити галерею. Спробуйте оновити сторінку.</div>';console.error(e)}}
load();</script>
</body></html>
