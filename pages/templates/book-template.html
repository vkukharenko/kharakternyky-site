<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Назва книги</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../css/books.css">

</head>

<body>

<header>

    <a href="../../index.html" class="logo">
        ХАРАКТЕРНИКИ
    </a>

    <nav>

        <a href="../books.html">Книги</a>
        <a href="../universe.html">Всесвіт</a>
        <a href="../characters.html">Персонажі</a>
        <a href="../gallery.html">Галерея</a>
        <a href="../author.html">Автор</a>

    </nav>

</header>

<main>

    <!-- ===================================== -->
    <!-- HERO                                  -->
    <!-- ===================================== -->

    <section class="book-hero">

        <img
            src="../../images/books/BOOK/cover.webp"
            alt="Обкладинка">

        <div class="hero-overlay">

            <p class="series">

                НАЗВА ЦИКЛУ

            </p>

            <h1>

                НАЗВА КНИГИ

            </h1>

            <h2>

                Підзаголовок

            </h2>

        </div>

    </section>

    <!-- ===================================== -->
    <!-- ПРО КНИГУ                             -->
    <!-- ===================================== -->

    <section class="book-description">

        <div class="container">

            <h2>Про книгу</h2>

            <p>

                Тут буде анотація книги.

            </p>

        </div>

    </section>

    <!-- ===================================== -->
    <!-- ІЛЮСТРАЦІЇ                            -->
    <!-- ===================================== -->

    <section class="book-gallery">

        <div class="container">

            <h2>Ілюстрації</h2>

            <!-- =============================== -->
            <!-- СЦЕНА                           -->
            <!-- =============================== -->

            <article class="scene">

                <img
                    src="../../images/books/BOOK/scene01.webp"
                    alt="">

                <div class="scene-text">

                    <h3>

                        Назва сцени

                    </h3>

                    <p>

                        Короткий опис сцени.

                    </p>

                </div>

            </article>

            <!--
                Скопіюй блок article.scene
                стільки разів, скільки потрібно.

                scene02.webp
                scene03.webp
                scene04.webp
                ...
            -->

        </div>

    </section>

</main>

</body>

</html>
